# Collecte HéliRadar : toutes les 15 minutes, photographie mondiale des
# hélicoptères via adsb.lol (ODbL) → POST vers le Worker Cloudflare qui
# filtre, localise (pays/département) et insère en base D1.
#
# Repo public = minutes GitHub Actions illimitées. Aucun secret dans le code.
# Passe complète (cercles régionaux, hélicos sans code type) : 2 fois par
# heure seulement, par politesse envers adsb.lol.
name: Collecte hélicos

on:
  schedule:
    - cron: "2,17,32,47 * * * *"   # décalé de l'heure pile (crons GH surchargés à :00)
  workflow_dispatch: {}

permissions:
  contents: write   # pour le commit de maintien mensuel (anti-désactivation 60 j)

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer adsb.lol et pousser vers le Worker
        env:
          RUN_KEY: ${{ secrets.HELIRADAR_RUN_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import datetime, json, time, urllib.request

          TYPES = ("R22,R44,R66,R88,EC20,EC25,EC30,EC35,EC45,EC55,EC75,H160,AS32,AS3B,AS50,AS55,AS65,"
                   "TIGR,B105,BK17,ALO2,ALO3,GAZL,PUMA,LAMA,B06,B06T,B212,B214,B222,B230,B407,B412,"
                   "B427,B429,B430,B505,B47G,B47J,UH1,A109,A119,A129,A139,A149,A169,A189,AW09,EH10,LYNX,S61,"
                   "S64,S76,S92,H60,H53,H47,H64,V22,MD52,MD60,EXPL,HU50,H269,KA26,KA27,KA32,KA52,KA62,"
                   "MI2,MI8,MI14,MI17,MI24,MI26,MI28,MI34,MI38,EN28,EN48,G2CA,NH90,DHRU,"
                   "H500,S55,S58T,S330,S333,UH12,EXEC,A600,KMAX,K126,B47T,A249")

          # Zones denses sur les 6 continents (hélicos sans code type, catégorie A7)
          CIRCLES = [
              # Amérique du Nord & Caraïbes
              (40.8, -74.2, 250), (33.5, -84.5, 250), (26.5, -81.0, 250),
              (28.8, -91.5, 250), (30.5, -97.5, 250), (36.5, -119.5, 250),
              (47.5, -122.5, 250), (49.5, -114.0, 250), (19.4, -99.1, 250),
              (18.3, -66.0, 250),
              # Amérique du Sud
              (4.6, -74.1, 250), (-12.0, -77.0, 250), (-33.4, -70.7, 250),
              (-34.6, -58.4, 250), (-22.5, -45.5, 250), (-15.8, -47.9, 250),
              # Europe
              (48.5, 1.5, 250), (44.5, 4.5, 250), (54.5, 3.5, 250),
              (52.5, -1.5, 250), (60.5, 5.0, 250), (45.5, 8.5, 250),
              (40.0, -3.7, 250), (38.5, 23.5, 250), (52.3, 21.0, 250),
              # Afrique & Moyen-Orient
              (25.5, 52.5, 250), (30.0, 31.2, 250), (4.5, 5.0, 250),
              (-26.2, 28.0, 250), (-1.3, 36.8, 250), (32.0, 34.8, 250),
              # Asie
              (19.0, 72.5, 250), (28.6, 77.2, 250), (13.7, 100.5, 250),
              (2.5, 103.0, 250), (22.3, 113.9, 250), (37.5, 127.0, 250),
              (35.5, 137.0, 250), (24.0, 121.0, 250),
              # Océanie
              (-33.0, 150.5, 250), (-31.9, 115.9, 250), (-41.0, 174.0, 250),
              (-37.8, 145.0, 250), (-27.5, 153.0, 250), (-16.9, 145.8, 250),
              # Amérique du Nord (complément)
              (61.2, -149.9, 250), (20.8, -156.3, 250), (41.8, -87.6, 250),
              (39.7, -104.9, 250), (47.5, -52.7, 250),
              # Europe (complément)
              (58.0, -1.0, 250), (53.0, -8.0, 250), (64.1, -21.9, 250),
              (41.0, 29.0, 250), (59.0, 25.0, 250),
              # DOM-TOM
              (-21.1, 55.5, 250), (4.9, -52.3, 250), (14.6, -61.0, 250),
              (-17.5, -149.6, 250), (-22.3, 166.4, 250),
              # Asie du Sud-Est & Chine côtière
              (10.8, 106.7, 250), (14.6, 121.0, 250), (-6.2, 106.8, 250),
              (5.0, 115.0, 250), (31.2, 121.5, 250),
              # Afrique (complément)
              (33.6, -7.6, 250), (-8.8, 13.2, 250),
          ]

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "heliradar-collector (github-actions)"})
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=60) as r:
                          return json.load(r)
                  except Exception as e:
                      print(f"  échec {e} (essai {attempt+1}) : {url[:80]}")
                      time.sleep(20)
              return None

          # Passe types monde : fusion de deux réseaux (leurs antennes diffèrent).
          # Licences : adsb.lol = ODbL ; airplanes.live = usage NON COMMERCIAL
          # uniquement — HéliRadar est un outil strictement personnel (à retirer
          # si commercialisation un jour).
          merged = {}
          for name, base in [("adsb.lol", "https://api.adsb.lol/v2"),
                             ("airplanes.live", "https://api.airplanes.live/v2")]:
              j = get(f"{base}/type/{TYPES}")
              if not j:
                  print(f"types {name} : indisponible")
                  continue
              news = 0
              for ac in j.get("ac", []):
                  if ac.get("hex") and ac["hex"] not in merged:
                      merged[ac["hex"]] = ac
                      news += 1
              print(f"types {name} : +{news} (total {len(merged)})")
              time.sleep(1.2)
          if not merged:
              raise SystemExit("aucune source types disponible")

          # Passe complète 2×/heure seulement (runs de :02 et :32)
          now_utc = datetime.datetime.now(datetime.UTC)
          minute = now_utc.minute
          if minute < 10 or 30 <= minute < 40:
              # rotation sur 3 réseaux (antennes différentes) au fil des passes
              SOURCES = ["adsb.lol", "airplanes.live", "adsb.fi"]
              idx = (now_utc.hour * 2 + (0 if minute < 10 else 1)) % 3
              src = SOURCES[idx]
              def circle_url(lat, lon, r):
                  if src == "adsb.fi":
                      return f"https://opendata.adsb.fi/api/v2/lat/{lat}/lon/{lon}/dist/{r}"
                  base = "https://api.adsb.lol/v2" if src == "adsb.lol" else "https://api.airplanes.live/v2"
                  return f"{base}/point/{lat}/{lon}/{r}"
              print(f"cercles via {src}")
              total_news = 0
              for lat, lon, r in CIRCLES:
                  time.sleep(1.3)
                  j = get(circle_url(lat, lon, r))
                  if not j:
                      continue
                  for ac in (j.get("ac") or j.get("aircraft") or []):
                      if ac.get("category") == "A7" and ac.get("hex") and ac["hex"] not in merged:
                          merged[ac["hex"]] = ac
                          total_news += 1
              print(f"cercles : +{total_news} hélicos catégorie A7 sans code type")
          else:
              print("passe cercles sautée (réservée aux runs de :02 et :32)")

          print(f"total fusionné : {len(merged)} hélicoptères")
          # collected_ts : le Worker respecte l'heure de COLLECTE même si le
          # fichier est rejoué plus tard depuis le tampon (panne de la base)
          json.dump({"collected_ts": int(time.time()), "ac": list(merged.values())},
                    open("/tmp/helis.json", "w"))
          EOF
          # Envoi vers la base, avec TAMPON anti-panne : si la base est
          # injoignable (ex. incident Cloudflare D1), la collecte est commitée
          # dans pending/ et rejouée automatiquement à la reprise. Aucune
          # photo perdue, et pas d'email d'échec pour une panne externe.
          post() {
            curl -sf --max-time 120 -X POST \
              -H 'Content-Type: application/json' \
              --data-binary "@$1" \
              "https://heliradar-collector.manuel-7lopes.workers.dev/ingest?key=$RUN_KEY"
          }
          git config user.name "heliradar-bot"
          git config user.email "actions@github.com"
          ok=0
          for attempt in 1 2 3; do
            if post /tmp/helis.json; then ok=1; echo; break; fi
            echo "envoi refusé (essai $attempt), nouvelle tentative dans 20 s…"
            sleep 20
          done
          if [ "$ok" = "1" ]; then
            # base joignable → rejouer les collectes en attente, s'il y en a
            flushed=0
            for f in pending/*.json; do
              [ -e "$f" ] || break
              if post "$f"; then echo; git rm -q "$f"; flushed=$((flushed+1)); sleep 2; else break; fi
            done
            if [ "$flushed" -gt 0 ]; then
              git commit -m "tampon : $flushed collecte(s) rejouée(s) après la panne"
              git pull --rebase >/dev/null 2>&1 || true
              git push || echo "push impossible (course entre runs), sans gravité"
            fi
            echo "envoi OK (tampon rejoué : $flushed fichier(s))"
          else
            mkdir -p pending
            cp /tmp/helis.json "pending/$(date -u +%Y%m%dT%H%M%S).json"
            git add pending
            git commit -m "tampon : base indisponible, collecte mise en attente"
            git pull --rebase >/dev/null 2>&1 || true
            git push || echo "push du tampon impossible (course entre runs)"
            echo "⚠️ base indisponible → collecte préservée dans pending/, rejouée à la reprise"
          fi

      # GitHub désactive les crons après 60 j sans activité du repo :
      # un commit vide de maintien le 1er du mois suffit à rester actif.
      - name: Maintien mensuel du cron
        if: github.event_name == 'schedule'
        run: |
          NOW_DAY=$(date -u +%d)
          NOW_HM=$(date -u +%H%M)
          if [ "$NOW_DAY" = "01" ] && [ "$NOW_HM" -lt "0020" ]; then
            git config user.name "heliradar-bot"
            git config user.email "actions@github.com"
            git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/keepalive
            cd /tmp/keepalive
            git commit --allow-empty -m "chore: maintien du cron ($(date -u +%F))"
            git push
          else
            echo "pas de maintien nécessaire aujourd'hui"
          fi
