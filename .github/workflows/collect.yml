# Collecte HéliRadar : toutes les 15 minutes, photographie mondiale des
# hélicoptères via adsb.lol (ODbL) → POST vers le Worker Cloudflare qui
# filtre, localise (pays/département) et insère en base D1.
#
# Repo public = minutes GitHub Actions illimitées. Aucun secret dans le code.
# Passe complète (cercles régionaux, hélicos sans code type) : 2 fois par
# heure seulement, par politesse envers adsb.lol.
name: Collecte hélicos

on:
  schedule:
    - cron: "2,17,32,47 * * * *"   # décalé de l'heure pile (crons GH surchargés à :00)
  workflow_dispatch: {}

permissions:
  contents: write   # pour le commit de maintien mensuel (anti-désactivation 60 j)

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Récupérer adsb.lol et pousser vers le Worker
        env:
          RUN_KEY: ${{ secrets.HELIRADAR_RUN_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import datetime, json, time, urllib.request

          TYPES = ("R22,R44,R66,R88,EC20,EC25,EC30,EC35,EC45,EC55,EC75,H160,AS32,AS3B,AS50,AS55,AS65,"
                   "TIGR,B105,BK17,ALO2,ALO3,GAZL,PUMA,LAMA,B06,B06T,B212,B214,B222,B230,B407,B412,"
                   "B427,B429,B430,B505,B47G,B47J,UH1,A109,A119,A129,A139,A149,A169,A189,AW09,EH10,LYNX,S61,"
                   "S64,S76,S92,H60,H53,H47,H64,V22,MD52,MD60,EXPL,HU50,H269,KA26,KA27,KA32,KA52,KA62,"
                   "MI2,MI8,MI14,MI17,MI24,MI26,MI28,MI34,MI38,EN28,EN48,G2CA,NH90,DHRU")

          CIRCLES = [
              (40.8, -74.2, 250), (33.5, -84.5, 250), (26.5, -81.0, 250),
              (28.8, -91.5, 250), (30.5, -97.5, 250), (36.5, -119.5, 250),
              (47.5, -122.5, 250), (49.5, -114.0, 250), (48.5, 1.5, 250),
              (44.5, 4.5, 250), (54.5, 3.5, 250), (52.5, -1.5, 250),
              (60.5, 5.0, 250), (45.5, 8.5, 250), (25.5, 52.5, 250),
              (35.5, 137.0, 250), (-33.0, 150.5, 250), (-22.5, -45.5, 250),
          ]

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "heliradar-collector (github-actions)"})
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=60) as r:
                          return json.load(r)
                  except Exception as e:
                      print(f"  échec {e} (essai {attempt+1}) : {url[:80]}")
                      time.sleep(20)
              return None

          merged = {}
          j = get(f"https://api.adsb.lol/v2/type/{TYPES}")
          if not j:
              raise SystemExit("adsb.lol inaccessible (requête types)")
          for ac in j.get("ac", []):
              merged[ac["hex"]] = ac
          print(f"passe types : {len(merged)} appareils")

          # Passe complète 2×/heure seulement (runs de :02 et :32)
          minute = datetime.datetime.now(datetime.UTC).minute
          if minute < 10 or 30 <= minute < 40:
              for lat, lon, r in CIRCLES:
                  time.sleep(1.3)
                  j = get(f"https://api.adsb.lol/v2/point/{lat}/{lon}/{r}")
                  if not j:
                      continue
                  news = 0
                  for ac in j.get("ac", []):
                      if ac.get("category") == "A7" and ac["hex"] not in merged:
                          merged[ac["hex"]] = ac
                          news += 1
                  print(f"cercle ({lat},{lon}) : +{news}")
          else:
              print("passe cercles sautée (réservée aux runs de :02 et :32)")

          print(f"total fusionné : {len(merged)} hélicoptères")
          json.dump({"ac": list(merged.values())}, open("/tmp/helis.json", "w"))
          EOF
          curl -sf --max-time 120 -X POST \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/helis.json \
            "https://heliradar-collector.manuel-7lopes.workers.dev/ingest?key=$RUN_KEY"

      # GitHub désactive les crons après 60 j sans activité du repo :
      # un commit vide de maintien le 1er du mois suffit à rester actif.
      - name: Maintien mensuel du cron
        if: github.event_name == 'schedule'
        run: |
          NOW_DAY=$(date -u +%d)
          NOW_HM=$(date -u +%H%M)
          if [ "$NOW_DAY" = "01" ] && [ "$NOW_HM" -lt "0020" ]; then
            git config user.name "heliradar-bot"
            git config user.email "actions@github.com"
            git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/keepalive
            cd /tmp/keepalive
            git commit --allow-empty -m "chore: maintien du cron ($(date -u +%F))"
            git push
          else
            echo "pas de maintien nécessaire aujourd'hui"
          fi
